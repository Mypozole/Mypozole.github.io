name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_GOOGLE_CALENDAR_API_KEY: ${{ vars.PUBLIC_GOOGLE_CALENDAR_API_KEY }}
          PUBLIC_CALENDAR_ID_FARMERS_MARKETS: ${{ vars.PUBLIC_CALENDAR_ID_FARMERS_MARKETS }}
          PUBLIC_CALENDAR_ID_FOOD_TRUCK: ${{ vars.PUBLIC_CALENDAR_ID_FOOD_TRUCK }}
          PUBLIC_CALENDAR_ID_IN_STORE_DEMOS: ${{ vars.PUBLIC_CALENDAR_ID_IN_STORE_DEMOS }}
          PUBLIC_CALENDAR_ID_POPUP_EVENTS: ${{ vars.PUBLIC_CALENDAR_ID_POPUP_EVENTS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
